services:
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout_local_only
      POSTGRES_DB: scoutanywhere
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - scout_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scoutanywhere"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  scout_db: